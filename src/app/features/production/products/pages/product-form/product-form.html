<!-- Product Form Page -->
<div class="p-6">
    <!-- Header -->
    <app-page-header [title]="isEditMode() ? 'Edit Product' : 'Add New Product'"
        [description]="isEditMode() ? 'Update product information' : 'Create a new product entry'" buttonText="← Back"
        buttonLink="../" buttonClass="bg-gray-800 hover:bg-gray-700 text-gray-300" />

    <!-- Form Container -->
    <div class="bg-[#111111] rounded-xl border border-gray-800 p-8">
        <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Form Fields Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Product Name -->
                <div>
                    <label for="product-name" class="block text-sm font-semibold text-gray-300 mb-2">
                        Product Name <span class="text-red-500">*</span>
                    </label>
                    <input type="text"
                        class="w-full px-4 py-3 bg-[#0a0a0a] border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all"
                        [class.border-gray-800]="!name?.invalid || !name?.touched"
                        [class.border-red-600]="name?.invalid && name?.touched" id="product-name" formControlName="name"
                        placeholder="Enter product name" />
                    @if (name?.invalid && name?.touched) {
                    <div class="text-red-400 text-sm mt-2">Product name is required</div>
                    }
                </div>

                <!-- Production Time -->
                <div>
                    <label for="production-time" class="block text-sm font-semibold text-gray-300 mb-2">
                        Production Time (hours) <span class="text-red-500">*</span>
                    </label>
                    <input type="number"
                        class="w-full px-4 py-3 bg-[#0a0a0a] border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all"
                        [class.border-gray-800]="!productionTime?.invalid || !productionTime?.touched"
                        [class.border-red-600]="productionTime?.invalid && productionTime?.touched" id="production-time"
                        formControlName="productionTime" placeholder="Enter production time" min="0" />
                    @if (productionTime?.invalid && productionTime?.touched) {
                    <div class="text-red-400 text-sm mt-2">Production time must be >= 0</div>
                    }
                </div>

                <!-- Cost -->
                <div>
                    <label for="product-cost" class="block text-sm font-semibold text-gray-300 mb-2">
                        Cost <span class="text-red-500">*</span>
                    </label>
                    <input type="number"
                        class="w-full px-4 py-3 bg-[#0a0a0a] border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all"
                        [class.border-gray-800]="!cost?.invalid || !cost?.touched"
                        [class.border-red-600]="cost?.invalid && cost?.touched" id="product-cost" formControlName="cost"
                        placeholder="Enter cost" min="0" step="0.01" />
                    @if (cost?.invalid && cost?.touched) {
                    <div class="text-red-400 text-sm mt-2">Cost must be >= 0</div>
                    }
                </div>

                <!-- Stock -->
                <div>
                    <label for="product-stock" class="block text-sm font-semibold text-gray-300 mb-2">
                        Stock <span class="text-red-500">*</span>
                    </label>
                    <input type="number"
                        class="w-full px-4 py-3 bg-[#0a0a0a] border rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-600 transition-all"
                        [class.border-gray-800]="!stock?.invalid || !stock?.touched"
                        [class.border-red-600]="stock?.invalid && stock?.touched" id="product-stock"
                        formControlName="stock" placeholder="Enter stock quantity" min="0" />
                    @if (stock?.invalid && stock?.touched) {
                    <div class="text-red-400 text-sm mt-2">Stock must be >= 0</div>
                    }
                </div>
            </div>

            <!-- Terms and Conditions -->
            <div class="border-t border-gray-800 pt-6">
                <div class="flex items-start gap-3">
                    <input
                        class="mt-1 w-4 h-4 bg-[#0a0a0a] border-2 border-gray-700 rounded text-blue-600 focus:ring-blue-600 focus:ring-2"
                        type="checkbox" id="invalidCheck" required />
                    <label class="text-sm text-gray-300" for="invalidCheck">
                        I agree to the terms and conditions
                    </label>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex gap-4 border-t border-gray-800 pt-6">
                <button
                    class="px-6 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg text-gray-300 font-medium transition-colors"
                    type="button" (click)="onCancel()">
                    Cancel
                </button>
                <button
                    class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                    type="submit" [disabled]="productForm.invalid || isLoading()">
                    {{ isLoading() ? 'Saving...' : isEditMode() ? 'Update Product' : 'Create Product' }}
                </button>
            </div>
        </form>
    </div>
</div>
