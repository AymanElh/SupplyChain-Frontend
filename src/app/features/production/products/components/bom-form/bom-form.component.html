<!-- BOM Form Component -->
<div class="bg-[#111111] rounded-xl border border-gray-800 p-8">
  <form [formGroup]="bomForm" (ngSubmit)="onSubmit()">
    <!-- Form Header -->
    <div class="mb-6 pb-4 border-b border-gray-800">
      <h2 class="text-2xl font-bold text-white">Create Bill of Materials</h2>
      <p class="text-sm text-gray-400 mt-1">Add materials required to manufacture this product</p>
    </div>

    <!-- Loading State -->
    @if (isLoadingData()) {
      <div class="text-center py-8">
        <div class="text-gray-400">Loading materials...</div>
      </div>
    } @else {
      <!-- Materials Section -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-6 pb-3 border-b border-gray-800">
          <div>
            <h3 class="text-xl font-bold text-white">Materials</h3>
            <p class="text-gray-400 text-sm mt-1">Select materials and quantities</p>
          </div>
          <button
            type="button"
            (click)="addItem()"
            class="px-4 py-2 bg-green-600 hover:bg-green-700 rounded-lg text-white font-medium transition-colors"
          >
            + Add Material
          </button>
        </div>

        <!-- Materials Table -->
        <app-material-items-table
          [items]="items"
          [materials]="materials"
          [showUnitPriceInput]="false"
          [addButtonText]="'+ Add Material'"
          [totalLabel]="'Total Material Cost'"
          [excludeMaterialIds]="existingMaterialIds"
          [materialIdFieldName]="'rawMaterialId'"
          (itemAdded)="addItem()"
          (itemRemoved)="removeItem($event)"
          (totalChanged)="onTotalChanged($event)"
        />
      </div>

      <!-- Form Actions -->
      <div class="flex gap-4 justify-end pt-6 border-t border-gray-800">
        <button
          type="button"
          (click)="onCancel()"
          class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg text-white font-medium transition-colors"
          [disabled]="isSubmitting()"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="px-6 py-3 bg-blue-600 hover:bg-blue-700 rounded-lg text-white font-medium transition-colors disabled:bg-gray-700 disabled:cursor-not-allowed"
          [disabled]="isSubmitting() || bomForm.invalid"
        >
          @if (isSubmitting()) {
            <span>Creating BOM...</span>
          } @else {
            <span>Create BOM</span>
          }
        </button>
      </div>
    }
  </form>
</div>
