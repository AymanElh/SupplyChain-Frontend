<!-- Suppliers Page -->
<div class="p-6">
  <!-- Header -->
  <app-page-header
    title="Suppliers"
    description="Manage your supplier network"
    buttonText="+ Add New Supplier"
    buttonLink="/supply/suppliers/create"
  />

  <!-- Search -->
  <div class="flex flex-col sm:flex-row gap-3 mb-6">
    <div class="relative flex-1">
      <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        type="text"
        [ngModel]="searchQuery()"
        (ngModelChange)="searchQuery.set($event)"
        (keyup.enter)="onSearch()"
        placeholder="Search supplier by exact name..."
        class="w-full pl-9 pr-4 py-2.5 text-sm bg-white dark:bg-[#111827] border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 shadow-[0_1px_3px_rgba(0,0,0,0.02)] transition-all"
      />
    </div>
    <div class="flex gap-2 shrink-0">
      <button
        type="button"
        (click)="onSearch()"
        [disabled]="isSearching()"
        class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 rounded-xl text-white text-xs font-semibold transition-colors disabled:opacity-40 shadow-xs"
      >
        {{ isSearching() ? 'Searching...' : 'Search' }}
      </button>
      @if (searchQuery()) {
        <button
          type="button"
          (click)="clearSearch()"
          class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-xl text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors border border-slate-200/80 dark:border-slate-700"
        >
          Clear ✕
        </button>
      }
    </div>
  </div>

  <!-- Suppliers Table -->
  <app-data-table
    [columns]="columns"
    [data]="suppliers()"
    [actions]="actions"
    [loading]="isLoading()"
    loadingMessage="Loading suppliers..."
    emptyMessage="No suppliers found. Add your first supplier to get started."
    emptyIcon="🏭"
    [trackBy]="trackBySupplier"
  />

  <!-- Pagination -->
  @if (totalPages() > 0 && !searchQuery()) {
  <div
    class="flex justify-between items-center mt-6 bg-white dark:bg-[#111827] rounded-xl border border-slate-200/90 dark:border-slate-800 shadow-[0_1px_3px_rgba(0,0,0,0.02)] px-6 py-4"
  >
    <div class="text-xs text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider">
      Page {{ currentPage() + 1 }} of {{ totalPages() }}
    </div>

    <div class="flex gap-2">
      <button
        (click)="previousPage()"
        [disabled]="currentPage() === 0"
        [class.opacity-40]="currentPage() === 0"
        [class.cursor-not-allowed]="currentPage() === 0"
        class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors disabled:hover:bg-slate-100 dark:disabled:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700"
      >
        ← Previous
      </button>

      <button
        (click)="nextPage()"
        [disabled]="currentPage() >= totalPages() - 1"
        [class.opacity-40]="currentPage() >= totalPages() - 1"
        [class.cursor-not-allowed]="currentPage() >= totalPages() - 1"
        class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors disabled:hover:bg-slate-100 dark:disabled:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-700"
      >
        Next →
      </button>
    </div>
  </div>
  }
</div>
