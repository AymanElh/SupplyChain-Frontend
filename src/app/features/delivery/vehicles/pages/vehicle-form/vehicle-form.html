<!-- Vehicle Form Page -->
<div class="p-6 max-w-4xl mx-auto">
  <!-- Header -->
  <app-page-header
    [title]="isEditMode ? 'Edit Vehicle' : 'Add New Vehicle'"
    [description]="isEditMode ? 'Update vehicle information' : 'Create a new vehicle entry'"
    buttonText="← Back"
    buttonLink="../"
    buttonClass="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700"
  />

  <!-- Form Container -->
  <div class="bg-white dark:bg-[#111827] rounded-xl border border-slate-200/90 dark:border-slate-800 p-8 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
    <form [formGroup]="vehicleForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Form Fields Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- License Plate -->
        <div class="md:col-span-2">
          <label for="vehicle-licensePlate" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            License Plate <span class="text-rose-500">*</span>
          </label>
          <input
            type="text"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-900 border rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all"
            [class.border-slate-200]="!isFieldInvalid('licensePlate')"
            [class.dark:border-slate-700]="!isFieldInvalid('licensePlate')"
            [class.border-rose-500]="isFieldInvalid('licensePlate')"
            id="vehicle-licensePlate"
            formControlName="licensePlate"
            placeholder="Enter license plate (must be unique)"
          />
          @if(isFieldInvalid('licensePlate')) {
          <div class="text-rose-500 text-xs mt-1.5">{{ getFieldError('licensePlate') }}</div>
          }
          @else {
          <div class="text-slate-400 dark:text-slate-500 text-xs mt-1.5">Each license plate must be unique across the fleet.</div>
          }
        </div>

        <!-- Type -->
        <div>
          <label for="vehicle-type" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            Type
          </label>
          <input
            type="text"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-900 border rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all"
            [class.border-slate-200]="!isFieldInvalid('type')"
            [class.dark:border-slate-700]="!isFieldInvalid('type')"
            [class.border-rose-500]="isFieldInvalid('type')"
            id="vehicle-type"
            formControlName="type"
            placeholder="e.g. Truck, Van, Motorcycle"
          />
          @if (isFieldInvalid('type')) {
          <div class="text-rose-500 text-xs mt-1.5">{{ getFieldError('type') }}</div>
          }
        </div>

        <!-- Model -->
        <div>
          <label for="vehicle-model" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            Model
          </label>
          <input
            type="text"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-900 border rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all"
            [class.border-slate-200]="!isFieldInvalid('model')"
            [class.dark:border-slate-700]="!isFieldInvalid('model')"
            [class.border-rose-500]="isFieldInvalid('model')"
            id="vehicle-model"
            formControlName="model"
            placeholder="Enter vehicle model"
          />
          @if (isFieldInvalid('model')) {
          <div class="text-rose-500 text-xs mt-1.5">{{ getFieldError('model') }}</div>
          }
        </div>
      </div>

      <!-- Terms and Conditions -->
      <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
        <div class="flex items-start gap-3">
          <input
            class="mt-1 w-4 h-4 rounded accent-slate-900 dark:accent-slate-100 bg-slate-50 dark:bg-slate-900"
            type="checkbox"
            id="invalidCheck"
            required
          />
          <label class="text-xs text-slate-600 dark:text-slate-400" for="invalidCheck">
            I confirm that the vehicle specifications and terms are verified
          </label>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-3 border-t border-slate-100 dark:border-slate-800 pt-6">
        <button
          class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors border border-slate-200/80 dark:border-slate-700"
          type="button"
          routerLink="../"
        >
          Cancel
        </button>
        <button
          class="px-5 py-2 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 rounded-lg text-white text-xs font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-xs"
          type="submit"
          [disabled]="vehicleForm.invalid || isSubmitting"
        >
          {{ isSubmitting ? 'Saving...' : isEditMode ? 'Update Vehicle' : 'Create Vehicle' }}
        </button>
      </div>
    </form>
  </div>
</div>
