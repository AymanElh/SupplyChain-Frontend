<!-- Customer Order Form Page -->
<div class="p-6 max-w-5xl mx-auto">
  <!-- Header -->
  <app-page-header
    title="New Customer Order"
    description="Sell finished products to a delivery customer"
    buttonText="← Back"
    buttonLink="../"
    buttonClass="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700"
  />

  <!-- Form Container -->
  <div class="bg-white dark:bg-[#111827] rounded-xl border border-slate-200/90 dark:border-slate-800 p-8 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
    <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <!-- Customer + Address -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label for="co-customer" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            Customer <span class="text-rose-500">*</span>
          </label>
          <select
            id="co-customer"
            formControlName="customerId"
            (change)="onCustomerChange($any($event.target).value)"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all"
          >
            <option [ngValue]="null" class="text-slate-400">-- Choose a customer --</option>
            @for (customer of customers(); track customer.id) {
              <option [ngValue]="customer.id">{{ customer.name }} — {{ customer.phone }}</option>
            }
          </select>
        </div>

        <div>
          <label for="co-address" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
            Shipping Address <span class="text-rose-500">*</span>
          </label>
          <select
            id="co-address"
            formControlName="addressId"
            [disabled]="addresses().length === 0"
            class="w-full px-4 py-2.5 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all disabled:opacity-50"
          >
            <option [ngValue]="null" class="text-slate-400">
              {{ addresses().length === 0 ? 'Select a customer first' : '-- Choose an address --' }}
            </option>
            @for (address of addresses(); track address.id) {
              <option [ngValue]="address.id">{{ address.street }}, {{ address.city }} {{ address.postalCode }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Order Lines -->
      <div class="border-t border-slate-100 dark:border-slate-800 pt-6">
        <div class="flex justify-between items-center mb-4">
          <div>
            <h3 class="text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider">Order Lines</h3>
            <p class="text-[11px] text-slate-400 dark:text-slate-500">Products reserved from finished stock</p>
          </div>
          <button
            type="button"
            (click)="addItem()"
            class="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors border border-slate-200/80 dark:border-slate-700"
          >
            + Add Line
          </button>
        </div>

        <div class="overflow-x-auto rounded-lg border border-slate-200/90 dark:border-slate-800">
          <table class="w-full text-left border-collapse">
            <thead class="bg-slate-50/80 dark:bg-slate-800/70 border-b border-slate-200/90 dark:border-slate-700/80">
              <tr>
                <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Product</th>
                <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Qty</th>
                <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider text-right">Unit Price</th>
                <th class="px-4 py-3 text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider text-right">Actions</th>
              </tr>
            </thead>
            <tbody formArrayName="items" class="divide-y divide-slate-100 dark:divide-slate-800/80 text-sm">
              @for (group of items.controls; track $index; let i = $index) {
                <tr [formGroupName]="i">
                  <td class="px-4 py-3">
                    <select
                      formControlName="productId"
                      (change)="onProductChange(i, $any($event.target).value)"
                      class="w-full px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25"
                    >
                      <option [ngValue]="null">-- Product --</option>
                      @for (product of products(); track product.id) {
                        <option [ngValue]="product.id">{{ product.name }}</option>
                      }
                    </select>
                  </td>
                  <td class="px-4 py-3">
                    <input
                      type="number"
                      min="1"
                      formControlName="quantity"
                      class="w-20 px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 text-xs focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25"
                    />
                  </td>
                  <td class="px-4 py-3 text-right">
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      formControlName="unitPrice"
                      class="w-28 px-3 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 text-xs text-right focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25"
                    />
                  </td>
                  <td class="px-4 py-3 text-right">
                    <button
                      type="button"
                      (click)="removeItem(i)"
                      [disabled]="items.length <= 1"
                      class="text-xs font-semibold text-rose-600 dark:text-rose-400 hover:text-rose-700 dark:hover:text-rose-300 transition-colors disabled:opacity-40"
                    >
                      Remove
                    </button>
                  </td>
                </tr>
              }
            </tbody>
            <tfoot class="bg-slate-50/80 dark:bg-slate-800/50 border-t border-slate-200/90 dark:border-slate-700/80">
              <tr>
                <td colspan="2" class="px-4 py-3.5 text-right text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                  Estimated Total:
                </td>
                <td colspan="2" class="px-4 py-3.5 text-right text-xl font-bold font-mono text-slate-900 dark:text-slate-100">
                  ${{ orderTotal() | number: '1.2-2' }}
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center justify-end gap-3 border-t border-slate-100 dark:border-slate-800 pt-6">
        <button
          type="button"
          routerLink="../"
          class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors border border-slate-200/80 dark:border-slate-700"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="orderForm.invalid || isSubmitting()"
          class="px-5 py-2 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 rounded-lg text-white text-xs font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-xs"
        >
          {{ isSubmitting() ? 'Creating...' : 'Create Order' }}
        </button>
      </div>
    </form>
  </div>
</div>
