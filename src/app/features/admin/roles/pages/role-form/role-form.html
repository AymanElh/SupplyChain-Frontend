<!-- Role Form Page -->
<div class="p-6 max-w-2xl mx-auto">
  <app-page-header
    [title]="isEditMode() ? 'Edit Role' : 'New Role'"
    description="Role names are matched against backend @PreAuthorize checks"
    buttonText="← Back"
    buttonLink="../"
    buttonClass="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700"
  />

  <div class="bg-white dark:bg-[#111827] rounded-xl border border-slate-200/90 dark:border-slate-800 p-8 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
    <form [formGroup]="roleForm" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label for="role-name" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
          Role Name <span class="text-rose-500">*</span>
        </label>
        <input
          id="role-name"
          type="text"
          formControlName="name"
          placeholder="E.G. MAGASINIER"
          class="w-full px-4 py-2.5 text-sm uppercase bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-900 dark:text-slate-100 placeholder-slate-400 placeholder:normal-case focus:outline-none focus:ring-2 focus:ring-slate-900/10 dark:focus:ring-slate-400/25 focus:border-slate-400 dark:focus:border-slate-600 transition-all"
        />
        <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-1.5">Uppercase letters, digits and underscores. Must match the Keycloak realm role.</p>
      </div>

      <div class="flex items-center justify-end gap-3 border-t border-slate-100 dark:border-slate-800 pt-6">
        <button
          type="button"
          routerLink="../"
          class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200/80 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 text-xs font-semibold transition-colors border border-slate-200/80 dark:border-slate-700"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="roleForm.invalid || isSubmitting()"
          class="px-5 py-2 bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 rounded-lg text-white text-xs font-semibold transition-colors disabled:opacity-40 disabled:cursor-not-allowed shadow-xs"
        >
          {{ isSubmitting() ? 'Saving...' : isEditMode() ? 'Update Role' : 'Create Role' }}
        </button>
      </div>
    </form>
  </div>
</div>
