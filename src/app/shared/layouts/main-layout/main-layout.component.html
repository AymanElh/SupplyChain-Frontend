<div class="flex h-screen bg-gray-900">
  <!-- Sidebar -->
  <aside
    [class.w-64]="isSidebarOpen()"
    [class.w-20]="!isSidebarOpen()"
    class="bg-gray-950 border-r border-gray-700 transition-all duration-300 flex flex-col"
  >
    <!-- Logo Section -->
    <div class="h-16 bg-black border-b border-gray-700 flex items-center justify-between px-4">
      <div *ngIf="isSidebarOpen()" class="text-white font-bold text-lg flex items-center gap-3">
        <div class="w-8 h-8 bg-blue-600 border border-blue-500 flex items-center justify-center">
          <span class="text-white text-xs font-bold">SX</span>
        </div>
        <span>SupplyChain X</span>
      </div>
      <div *ngIf="!isSidebarOpen()">
        <div class="w-8 h-8 bg-blue-600 border border-blue-500 flex items-center justify-center">
          <span class="text-white text-xs font-bold">SX</span>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center gap-3 px-3 py-2 text-gray-400 hover:bg-gray-800 hover:text-white transition-colors border border-transparent hover:border-gray-700"
        [title]="isSidebarOpen() ? 'Collapse' : 'Expand'"
      >
        <span class="text-sm">{{ isSidebarOpen() ? '◀' : '▶' }}</span>
        <span *ngIf="isSidebarOpen()" class="text-sm font-medium">Collapse</span>
      </button>

      <div
        *ngIf="isSidebarOpen()"
        class="px-3 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wider mt-4"
      >
        Navigation
      </div>

      <a
        *ngFor="let item of navigationItems"
        [routerLink]="item.path"
        routerLinkActive="bg-blue-600 text-white border-blue-500"
        class="flex items-center gap-3 px-3 py-3 text-gray-400 hover:bg-gray-800 hover:text-white transition-colors border border-transparent hover:border-gray-700"
      >
        <span class="text-base flex-shrink-0">{{ item.icon }}</span>
        <span *ngIf="isSidebarOpen()" class="text-sm font-medium">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="px-3 py-4 border-t border-gray-700 bg-black">
      <button
        class="w-full flex items-center gap-3 px-3 py-2 text-gray-400 hover:bg-gray-800 hover:text-white transition-colors border border-transparent hover:border-gray-700"
        [title]="isSidebarOpen() ? 'Settings' : 'Settings'"
      >
        <span class="text-base flex-shrink-0">⚙️</span>
        <span *ngIf="isSidebarOpen()" class="text-sm font-medium">Settings</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Navigation Bar -->
    <header
      class="h-16 bg-gray-950 border-b-2 border-gray-700 flex items-center justify-between px-8"
    >
      <div class="text-white text-xl font-semibold">Dashboard Overview</div>
      <div class="flex items-center gap-3">
        <button
          class="px-3 py-2 bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 hover:text-white hover:border-gray-600 transition-colors text-sm"
          title="Notifications"
        >
          🔔 Notifications
        </button>
        <button
          class="px-3 py-2 bg-gray-900 border border-gray-700 text-gray-300 hover:bg-gray-800 hover:text-white hover:border-gray-600 transition-colors text-sm"
          title="Profile"
        >
          👤 Profile
        </button>
      </div>
    </header>

    <!-- Main Content Area - Router Outlet -->
    <main class="flex-1 overflow-auto bg-gray-900 p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
